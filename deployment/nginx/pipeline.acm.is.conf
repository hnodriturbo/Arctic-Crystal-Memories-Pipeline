# ==========================================
# File: deployment/nginx/pipeline.acm.is.conf
# Purpose:
#  - Terminate HTTPS for pipeline.acm.is.
#  - Proxy the private Next.js runtime on 127.0.0.1:3003.
#  - Preserve streaming uploads and Server-Sent Event output.
# ==========================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name pipeline.acm.is;

    # Cloudflare Pro accepts request bodies up to 100 MB. Larger converter
    # inputs must be copied to the VPS workspace through SSH/SFTP.
    client_max_body_size 100m;
    client_body_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # Upload requests are streamed to Next.js and Python output is sent
        # back immediately over SSE instead of being buffered by Nginx.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    ssl_certificate /etc/letsencrypt/live/pipeline.acm.is/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pipeline.acm.is/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;

    server_name pipeline.acm.is;

    return 301 https://pipeline.acm.is$request_uri;
}
