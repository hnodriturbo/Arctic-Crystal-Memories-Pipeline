# ==========================================
# File: deployment/nginx/pipeline.acm.is.bootstrap.conf
# Purpose:
#  - Serve the first ACME HTTP challenge before the HTTPS certificate exists.
#  - Provide temporary HTTP access to the isolated pipeline origin.
# ==========================================

server {
    listen 80;
    listen [::]:80;

    server_name pipeline.acm.is;

    client_max_body_size 100m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
