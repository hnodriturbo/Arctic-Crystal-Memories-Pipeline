schema_version = "1.0.0"

id = "acm_scene_composer"
version = "0.2.0"
name = "ACM Scene Composer"
tagline = "Compose ACM reliefs and Meshy full 3D assets"
maintainer = "Arctic Crystal Memories"
type = "add-on"

blender_version_min = "5.1.0"
license = ["SPDX:GPL-3.0-or-later"]

[permissions]
files = "Import and export local textured 3D assets"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  ".git",
  "*.zip",
  "tests/",
]
